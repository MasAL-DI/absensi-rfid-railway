name: Railway Auto Pause/Resume

on:
  schedule:
    # Pause tiap Jumat jam 15:00 WIB (08:00 UTC)
    - cron: '0 8 * * 5'
    # Resume tiap Senin jam 06:00 WIB (23:00 UTC hari Minggu)
    - cron: '0 23 * * 0'
  workflow_dispatch:

jobs:
  pause-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Pause/Resume Railway Service
        run: |
          PROJECT_ID=${{ secrets.RAILWAY_PROJECT_ID }}
          SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID }}
          
          if [[ $(date +%u) -eq 5 ]]; then
            echo "📌 Pausing service untuk Sabtu-Minggu..."
            curl -X POST https://api.railway.app/graphql \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"query":"mutation { serviceInstanceUpdate(id:\"'$SERVICE_ID'\", input:{isActive:false}) { id } }"}'
          else
            echo "▶️ Resuming service untuk Senin..."
            curl -X POST https://api.railway.app/graphql \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"query":"mutation { serviceInstanceUpdate(id:\"'$SERVICE_ID'\", input:{isActive:true}) { id } }"}'
          fi